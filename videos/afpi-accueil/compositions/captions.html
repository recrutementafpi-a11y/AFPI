<div class="clip cap" id="cap0" data-start="7.52" data-duration="2.44" data-track-index="6"><span>L'AFPI fait partie du réseau Pôle Formation,</span></div>
<div class="clip cap" id="cap1" data-start="9.90" data-duration="2.31" data-track-index="6"><span>l'outil de formation de la métallurgie.</span></div>
<div class="clip cap" id="cap2" data-start="12.15" data-duration="2.13" data-track-index="6"><span>Deux centres vous accueillent :</span></div>
<div class="clip cap" id="cap3" data-start="14.22" data-duration="1.77" data-track-index="6"><span>Dunkerque, et Gravelines.</span></div>
<div class="clip cap" id="cap4" data-start="19.52" data-duration="0.91" data-track-index="6"><span>Notre métier :</span></div>
<div class="clip cap" id="cap5" data-start="20.37" data-duration="1.97" data-track-index="6"><span>analyser, conseiller, former,</span></div>
<div class="clip cap" id="cap6" data-start="22.28" data-duration="3.02" data-track-index="6"><span>professionnaliser, et développer vos compétences.</span></div>
<div class="clip cap" id="cap7" data-start="25.24" data-duration="2.83" data-track-index="6"><span>Pour créer de la valeur par la formation.</span></div>
<div class="clip cap" id="cap8" data-start="30.52" data-duration="1.65" data-track-index="6"><span>Quatre grands domaines.</span></div>
<div class="clip cap" id="cap9" data-start="32.11" data-duration="3.29" data-track-index="6"><span>La maintenance, de l'électrotechnique à l'instrumentation.</span></div>
<div class="clip cap" id="cap10" data-start="35.34" data-duration="2.77" data-track-index="6"><span>La chaudronnerie, la tuyauterie et le soudage.</span></div>
<div class="clip cap" id="cap11" data-start="38.05" data-duration="2.73" data-track-index="6"><span>La sécurité, des habilitations à la conduite d'engins.</span></div>
<div class="clip cap" id="cap12" data-start="40.72" data-duration="1.24" data-track-index="6"><span>Et le tertiaire :</span></div>
<div class="clip cap" id="cap13" data-start="41.90" data-duration="2.40" data-track-index="6"><span>management, langues, bureautique.</span></div>
<div class="clip cap" id="cap14" data-start="47.52" data-duration="2.43" data-track-index="6"><span>Entreprises, salariés, demandeurs d'emploi,</span></div>
<div class="clip cap" id="cap15" data-start="49.89" data-duration="1.46" data-track-index="6"><span>jeunes en alternance :</span></div>
<div class="clip cap" id="cap16" data-start="51.29" data-duration="2.24" data-track-index="6"><span>chacun trouve sa place à l'AFPI.</span></div>
<div class="clip cap" id="cap17" data-start="55.52" data-duration="1.71" data-track-index="6"><span>Une qualité reconnue :</span></div>
<div class="clip cap" id="cap18" data-start="57.17" data-duration="1.30" data-track-index="6"><span>Qualiopi, CQPM, TOSA,</span></div>
<div class="clip cap" id="cap19" data-start="58.41" data-duration="2.17" data-track-index="6"><span>TOEIC et Certificat Voltaire.</span></div>
<div class="clip cap" id="cap20" data-start="68.02" data-duration="2.82" data-track-index="6"><span>Respectez le sens de circulation et les règles de</span></div>
<div class="clip cap" id="cap21" data-start="70.78" data-duration="2.55" data-track-index="6"><span>stationnement. Garez-vous en marche arrière,</span></div>
<div class="clip cap" id="cap22" data-start="73.27" data-duration="1.02" data-track-index="6"><span>prêt à repartir.</span></div>
<div class="clip cap" id="cap23" data-start="74.23" data-duration="2.76" data-track-index="6"><span>Les journées se déroulent de 8 h à 12 h,</span></div>
<div class="clip cap" id="cap24" data-start="76.93" data-duration="2.49" data-track-index="6"><span>puis de 13 h à 16 h.</span></div>
<div class="clip cap" id="cap25" data-start="82.02" data-duration="3.83" data-track-index="6"><span>Vos équipements de protection individuelle sont indiqués sur votre</span></div>
<div class="clip cap" id="cap26" data-start="85.79" data-duration="4.00" data-track-index="6"><span>convocation. Ils sont contrôlés avant toute prise de poste.</span></div>
<div class="clip cap" id="cap27" data-start="92.52" data-duration="4.10" data-track-index="6"><span>En atelier, aucune machine sans formation préalable ni autorisation</span></div>
<div class="clip cap" id="cap28" data-start="96.56" data-duration="0.76" data-track-index="6"><span>du formateur.</span></div>
<div class="clip cap" id="cap29" data-start="97.26" data-duration="1.29" data-track-index="6"><span>En cas d'accident,</span></div>
<div class="clip cap" id="cap30" data-start="98.49" data-duration="1.57" data-track-index="6"><span>prévenez le responsable,</span></div>
<div class="clip cap" id="cap31" data-start="100.00" data-duration="1.98" data-track-index="6"><span>qui appellera les secours.</span></div>
<div class="clip cap" id="cap32" data-start="101.92" data-duration="1.84" data-track-index="6"><span>Ordre, propreté, rangement.</span></div>
<div class="clip cap" id="cap33" data-start="106.52" data-duration="2.92" data-track-index="6"><span>Le règlement intérieur est affiché dans le hall.</span></div>
<div class="clip cap" id="cap34" data-start="109.38" data-duration="2.08" data-track-index="6"><span>Pas de sortie pendant les pauses,</span></div>
<div class="clip cap" id="cap35" data-start="111.40" data-duration="1.21" data-track-index="6"><span>respect des horaires,</span></div>
<div class="clip cap" id="cap36" data-start="112.55" data-duration="2.77" data-track-index="6"><span>ni nourriture ni boisson en salle et en atelier.</span></div>
<div class="clip cap" id="cap37" data-start="115.26" data-duration="2.36" data-track-index="6"><span>Interdiction de fumer à l'intérieur :</span></div>
<div class="clip cap" id="cap38" data-start="117.56" data-duration="2.28" data-track-index="6"><span>des zones fumeurs sont prévues.</span></div>
<div class="clip cap" id="cap39" data-start="122.52" data-duration="1.01" data-track-index="6"><span>Sécurité incendie.</span></div>
<div class="clip cap" id="cap40" data-start="123.47" data-duration="2.92" data-track-index="6"><span>Les consignes et les plans d'évacuation sont affichés,</span></div>
<div class="clip cap" id="cap41" data-start="126.33" data-duration="1.17" data-track-index="6"><span>le matériel est vérifié,</span></div>
<div class="clip cap" id="cap42" data-start="127.44" data-duration="1.45" data-track-index="6"><span>des exercices sont organisés.</span></div>
<div class="clip cap" id="cap43" data-start="128.83" data-duration="1.12" data-track-index="6"><span>En cas d'incendie,</span></div>
<div class="clip cap" id="cap44" data-start="129.89" data-duration="1.84" data-track-index="6"><span>donnez l'alerte ou déclenchez l'alarme,</span></div>
<div class="clip cap" id="cap45" data-start="131.67" data-duration="1.11" data-track-index="6"><span>sans prendre de risque.</span></div>
<div class="clip cap" id="cap46" data-start="132.72" data-duration="1.74" data-track-index="6"><span>N'ouvrez ni portes ni fenêtres.</span></div>
<div class="clip cap" id="cap47" data-start="134.40" data-duration="2.39" data-track-index="6"><span>Rejoignez l'issue de secours la plus proche,</span></div>
<div class="clip cap" id="cap48" data-start="136.73" data-duration="1.31" data-track-index="6"><span>sans revenir en arrière,</span></div>
<div class="clip cap" id="cap49" data-start="137.98" data-duration="1.68" data-track-index="6"><span>puis le point de rassemblement,</span></div>
<div class="clip cap" id="cap50" data-start="139.60" data-duration="3.13" data-track-index="6"><span>et attendez les consignes de l'équipe pédagogique.</span></div>
<div class="clip cap" id="cap51" data-start="152.52" data-duration="2.73" data-track-index="6"><span>Retrouvez-nous sur afpi-formation.com.</span></div>
