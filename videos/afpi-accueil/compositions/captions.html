<div class="clip cap" id="cap0" data-start="7.52" data-duration="2.56" data-track-index="6"><span>L'AFPI fait partie du réseau Pôle Formation,</span></div>
<div class="clip cap" id="cap1" data-start="10.02" data-duration="2.49" data-track-index="6"><span>l'outil de formation de la métallurgie.</span></div>
<div class="clip cap" id="cap2" data-start="12.50" data-duration="1.75" data-track-index="6"><span>Deux centres vous accueillent :</span></div>
<div class="clip cap" id="cap3" data-start="14.19" data-duration="2.35" data-track-index="6"><span>Dunkerque, et Gravelines.</span></div>
<div class="clip cap" id="cap4" data-start="19.52" data-duration="1.34" data-track-index="6"><span>Notre métier :</span></div>
<div class="clip cap" id="cap5" data-start="20.80" data-duration="2.98" data-track-index="6"><span>analyser, conseiller, former,</span></div>
<div class="clip cap" id="cap6" data-start="23.72" data-duration="3.31" data-track-index="6"><span>professionnaliser, et développer vos compétences.</span></div>
<div class="clip cap" id="cap7" data-start="27.02" data-duration="2.54" data-track-index="6"><span>Pour créer de la valeur par la formation.</span></div>
<div class="clip cap" id="cap8" data-start="30.72" data-duration="1.56" data-track-index="6"><span>Quatre grands domaines.</span></div>
<div class="clip cap" id="cap9" data-start="32.27" data-duration="3.95" data-track-index="6"><span>La maintenance, de l'électrotechnique à l'instrumentation.</span></div>
<div class="clip cap" id="cap10" data-start="36.21" data-duration="3.12" data-track-index="6"><span>La chaudronnerie, la tuyauterie et le soudage.</span></div>
<div class="clip cap" id="cap11" data-start="39.32" data-duration="3.86" data-track-index="6"><span>La sécurité, des habilitations à la conduite d'engins.</span></div>
<div class="clip cap" id="cap12" data-start="43.17" data-duration="1.41" data-track-index="6"><span>Et le tertiaire :</span></div>
<div class="clip cap" id="cap13" data-start="44.52" data-duration="2.05" data-track-index="6"><span>management, langues, bureautique.</span></div>
<div class="clip cap" id="cap14" data-start="47.72" data-duration="3.58" data-track-index="6"><span>Entreprises, salariés, demandeurs d'emploi,</span></div>
<div class="clip cap" id="cap15" data-start="51.24" data-duration="1.72" data-track-index="6"><span>jeunes en alternance :</span></div>
<div class="clip cap" id="cap16" data-start="52.90" data-duration="2.10" data-track-index="6"><span>chacun trouve sa place à l'AFPI.</span></div>
<div class="clip cap" id="cap17" data-start="56.12" data-duration="1.66" data-track-index="6"><span>Une qualité reconnue :</span></div>
<div class="clip cap" id="cap18" data-start="57.72" data-duration="3.05" data-track-index="6"><span>Qualiopi, CQPM, TOSA,</span></div>
<div class="clip cap" id="cap19" data-start="60.71" data-duration="2.51" data-track-index="6"><span>TOEIC et Certificat Voltaire.</span></div>
<div class="clip cap" id="cap20" data-start="69.42" data-duration="2.78" data-track-index="6"><span>Respectez le sens de circulation et les règles de</span></div>
<div class="clip cap" id="cap21" data-start="72.14" data-duration="2.99" data-track-index="6"><span>stationnement. Garez-vous en marche arrière,</span></div>
<div class="clip cap" id="cap22" data-start="75.07" data-duration="1.54" data-track-index="6"><span>prêt à repartir.</span></div>
<div class="clip cap" id="cap23" data-start="76.60" data-duration="2.44" data-track-index="6"><span>Les journées se déroulent de 8 h à 12 h,</span></div>
<div class="clip cap" id="cap24" data-start="78.98" data-duration="1.97" data-track-index="6"><span>puis de 13 h à 16 h.</span></div>
<div class="clip cap" id="cap25" data-start="83.42" data-duration="3.99" data-track-index="6"><span>Vos équipements de protection individuelle sont indiqués sur votre</span></div>
<div class="clip cap" id="cap26" data-start="87.35" data-duration="3.96" data-track-index="6"><span>convocation. Ils sont contrôlés avant toute prise de poste.</span></div>
<div class="clip cap" id="cap27" data-start="93.92" data-duration="4.61" data-track-index="6"><span>En atelier, aucune machine sans formation préalable ni autorisation</span></div>
<div class="clip cap" id="cap28" data-start="98.47" data-duration="1.21" data-track-index="6"><span>du formateur.</span></div>
<div class="clip cap" id="cap29" data-start="99.67" data-duration="1.32" data-track-index="6"><span>En cas d'accident,</span></div>
<div class="clip cap" id="cap30" data-start="100.93" data-duration="1.66" data-track-index="6"><span>prévenez le responsable,</span></div>
<div class="clip cap" id="cap31" data-start="102.53" data-duration="1.73" data-track-index="6"><span>qui appellera les secours.</span></div>
<div class="clip cap" id="cap32" data-start="104.25" data-duration="3.03" data-track-index="6"><span>Ordre, propreté, rangement.</span></div>
<div class="clip cap" id="cap33" data-start="108.42" data-duration="3.50" data-track-index="6"><span>Le règlement intérieur est affiché dans le hall.</span></div>
<div class="clip cap" id="cap34" data-start="111.91" data-duration="1.83" data-track-index="6"><span>Pas de sortie pendant les pauses,</span></div>
<div class="clip cap" id="cap35" data-start="113.68" data-duration="1.58" data-track-index="6"><span>respect des horaires,</span></div>
<div class="clip cap" id="cap36" data-start="115.20" data-duration="2.88" data-track-index="6"><span>ni nourriture ni boisson en salle et en atelier.</span></div>
<div class="clip cap" id="cap37" data-start="118.07" data-duration="2.36" data-track-index="6"><span>Interdiction de fumer à l'intérieur :</span></div>
<div class="clip cap" id="cap38" data-start="120.37" data-duration="1.95" data-track-index="6"><span>des zones fumeurs sont prévues.</span></div>
<div class="clip cap" id="cap39" data-start="124.42" data-duration="1.75" data-track-index="6"><span>Sécurité incendie.</span></div>
<div class="clip cap" id="cap40" data-start="126.16" data-duration="3.18" data-track-index="6"><span>Les consignes et les plans d'évacuation sont affichés,</span></div>
<div class="clip cap" id="cap41" data-start="129.28" data-duration="1.70" data-track-index="6"><span>le matériel est vérifié,</span></div>
<div class="clip cap" id="cap42" data-start="130.92" data-duration="2.20" data-track-index="6"><span>des exercices sont organisés.</span></div>
<div class="clip cap" id="cap43" data-start="133.11" data-duration="1.36" data-track-index="6"><span>En cas d'incendie,</span></div>
<div class="clip cap" id="cap44" data-start="134.41" data-duration="2.13" data-track-index="6"><span>donnez l'alerte ou déclenchez l'alarme,</span></div>
<div class="clip cap" id="cap45" data-start="136.48" data-duration="1.79" data-track-index="6"><span>sans prendre de risque.</span></div>
<div class="clip cap" id="cap46" data-start="138.26" data-duration="1.97" data-track-index="6"><span>N'ouvrez ni portes ni fenêtres.</span></div>
<div class="clip cap" id="cap47" data-start="140.22" data-duration="2.47" data-track-index="6"><span>Rejoignez l'issue de secours la plus proche,</span></div>
<div class="clip cap" id="cap48" data-start="142.63" data-duration="1.57" data-track-index="6"><span>sans revenir en arrière,</span></div>
<div class="clip cap" id="cap49" data-start="144.14" data-duration="1.77" data-track-index="6"><span>puis le point de rassemblement,</span></div>
<div class="clip cap" id="cap50" data-start="145.85" data-duration="2.82" data-track-index="6"><span>et attendez les consignes de l'équipe pédagogique.</span></div>
<div class="clip cap" id="cap51" data-start="156.32" data-duration="2.76" data-track-index="6"><span>Retrouvez-nous sur afpi-formation.com.</span></div>
